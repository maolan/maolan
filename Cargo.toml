[package]
name = "maolan"
default-run = "maolan"
version = "0.4.1"
edition = "2024"
description = "Rust DAW application for recording, editing, routing, automation, export, and plugin hosting"
authors = ["Maolan Team"]
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/maolan"
homepage = "https://maolan.rs"
documentation = "https://maolan.rs"
keywords = ["audio", "midi", "daw", "clap", "lv2"]
categories = ["multimedia::audio"]

[profile.dev]
opt-level = 3
debug = true

[dependencies]
chrono = "0.4"
crossterm = "0.29.0"
dirs = "7.0.0"
ebur128 = "0.1"
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
i24 = "2.3.5"
maolan-generate = "0.0.18"
maolan-editor = { version = "0.1.1", default-features = false, features = ["embedded"] }
maolan-engine = { version = "0.4.15", features = ["audio", "midi", "plugins", "mixosc"] }
maolan-pitch = "0.0.2"
maolan-plugin-host = "0.1.2"
maolan-widgets = "0.0.42"
mixosc = "0.0.16"
midly = "0.5.3"
pitch-detection = "0.3.0"
ratatui = "0.30.2"
regex = "1.13.1"
rfd = "0.17.2"
rubato = "5.0.1"
wide = "1.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
timestretch = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.12.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
x11-dl = "2.21.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Devices_Properties", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "maolan"
maintainer = "Maolan Team <studio@maolan.rs>"
section = "sound"
priority = "optional"
copyright = "2026, Maolan Team <studio@maolan.rs>"
depends = "jackd2 | pipewire-jack, libasound2t64 | libasound2, libx11-6"
assets = [
  ["target/release/maolan", "usr/bin/", "755"],
  ["target/release/maolan-cli", "usr/bin/", "755"],
  ["target/release/maolan-osc", "usr/bin/", "755"],
  ["target/release/maolan-plugin-host", "usr/bin/", "755"],
  ["assets/desktop/maolan.desktop", "usr/share/applications/", "644"],
  ["assets/images/maolan-icon.svg", "usr/share/icons/hicolor/scalable/apps/maolan.svg", "644"],
  ["README.md", "usr/share/doc/maolan/", "644"],
  ["LICENSE", "usr/share/doc/maolan/", "644"],
]

[package.metadata.generate-rpm]
name = "maolan"
summary = "Rust Digital Audio Workstation"
license = "BSD-2-Clause"
url = "https://github.com/maolan/maolan"
assets = [
  { source = "target/release/maolan", dest = "/usr/bin/maolan", mode = "755" },
  { source = "target/release/maolan-cli", dest = "/usr/bin/maolan-cli", mode = "755" },
  { source = "target/release/maolan-osc", dest = "/usr/bin/maolan-osc", mode = "755" },
  { source = "target/release/maolan-plugin-host", dest = "/usr/bin/maolan-plugin-host", mode = "755" },
  { source = "assets/desktop/maolan.desktop", dest = "/usr/share/applications/maolan.desktop", mode = "644" },
  { source = "assets/images/maolan-icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/maolan.svg", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/maolan/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/maolan/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"(jack-audio-connection-kit or pipewire-jack-audio-connection-kit)" = "*"
"alsa-lib" = "*"
"libX11" = "*"
